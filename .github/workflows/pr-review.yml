name: PR Review Agent

on:
  pull_request:
    paths:
      - 'target_repo/**'

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Checkout dewa-pr-review-agent
        uses: actions/checkout@v4

      - name: Checkout dewa-observability (sibling repo)
        uses: actions/checkout@v4
        with:
          repository: Thirupathirr/dewa-observability-harness_control
          path: dewa-observability-harness_control
          token: ${{ secrets.CROSS_REPO_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dewa-observability
        run: pip install -e ./dewa-observability-harness_control

      - name: Install agent requirements
        run: pip install -r requirements.txt

      - name: Run the squad and post the result as a PR comment
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: python examples/run_squad_ci.py
