<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<title>DEWA Agentic Squad — Live Run</title>
<style>
  body{margin:0;background:#0F1420;font-family:'Segoe UI',Calibri,Arial,sans-serif;color:#EAEEFC;}
  .wrap{display:flex;height:100vh;}
  .left{width:62%;padding:26px;display:flex;flex-direction:column;overflow-y:auto;}
  .right{width:38%;background:#151B2C;padding:26px;overflow-y:auto;border-left:1px solid #262E45;}

  h1{font-family:Cambria,Georgia,serif;font-size:19px;margin:0 0 4px;color:#fff;}
  .sub{font-size:11.5px;color:#8A93A8;margin-bottom:18px;}

  .final-banner{border-radius:10px;padding:12px 18px;margin-bottom:20px;font-size:13px;font-weight:700;
    border:2px solid #2E3A54;background:#1B2338;color:#8A93A8;}
  .final-banner.approved{border-color:#0F8A5F;background:#0F1F18;color:#3FD98A;}
  .final-banner.escalated{border-color:#C9973A;background:#2A2110;color:#F1C866;}
  .final-banner.blocked{border-color:#C0392B;background:#2A1212;color:#F27E70;}

  .agents-grid{display:flex;gap:14px;flex-wrap:wrap;}
  .agent-col{flex:1;min-width:230px;background:#161D30;border:1px solid #262E45;border-radius:10px;padding:14px;}
  .agent-head{margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid #262E45;}
  .agent-head .name{font-size:13px;font-weight:700;color:#fff;}
  .agent-head .meta{font-size:9.5px;color:#6B7690;margin-top:2px;font-family:Consolas,monospace;}

  .step{background:#1B2338;border:1.5px solid #2E3A54;border-radius:8px;padding:9px 11px;margin-bottom:7px;
    transition:all 0.3s ease;position:relative;}
  .step .name{font-size:11.5px;font-weight:700;color:#C7CEE0;padding-right:66px;display:block;}
  .step .detail{font-size:9.5px;color:#6B7690;margin-top:3px;}
  .step.active{border-color:#D9A441;background:#2A2410;}
  .step.active .name{color:#F1C866;}
  .step.passed{border-color:#0F8A5F;background:#0F1F18;}
  .step.passed .name{color:#3FD98A;}
  .step.blocked{border-color:#C0392B;background:#2A1212;}
  .step.blocked .name{color:#F27E70;}
  .step.escalated{border-color:#C9973A;background:#2A2110;}
  .step.escalated .name{color:#F1C866;}
  .step.fixed{border-color:#3A5BA0;background:#161D30;}
  .step.fixed .name{color:#8FB3FF;}

  .badge{font-size:8px;letter-spacing:0.5px;text-transform:uppercase;font-weight:700;
    padding:1px 6px;border-radius:8px;position:absolute;top:9px;right:9px;}
  .badge.active{background:#D9A441;color:#1a1a1a;}
  .badge.passed{background:#0F8A5F;color:#fff;}
  .badge.blocked{background:#C0392B;color:#fff;}
  .badge.escalated{background:#C9973A;color:#1a1a1a;}
  .badge.fixed{background:#3A5BA0;color:#fff;}

  .log-title{font-size:12px;font-weight:700;color:#8A93A8;letter-spacing:1px;
    text-transform:uppercase;margin-bottom:14px;}
  .log-entry{border-left:2px solid #2E3A54;padding:7px 0 7px 12px;margin-bottom:2px;font-size:11.5px;}
  .log-entry .ts{color:#565F78;font-family:Consolas,monospace;font-size:9.5px;}
  .log-entry .agent-tag{color:#8FB3FF;font-weight:700;margin:0 5px;}
  .log-entry .step-name{color:#B7C4DA;}
  .log-entry .status-passed{color:#3FD98A;}
  .log-entry .status-active{color:#F1C866;}
  .log-entry .status-blocked{color:#F27E70;}
  .log-entry .status-escalated{color:#F1C866;}
  .log-entry .detail{color:#6B7690;margin-top:2px;font-size:10.5px;word-break:break-word;}

  .empty{color:#565F78;font-size:12px;font-style:italic;}
</style></head>
<body>
<div class="wrap">
  <div class="left">
    <h1>DEWA Agentic Squad — Live Run</h1>
    <div class="sub">Orchestrator + specialist sub-agents · polling dashboard/run_log.json every second</div>
    <div id="finalBanner" class="final-banner">Waiting for a run — execute examples/run_squad.py</div>
    <div class="agents-grid" id="agentsGrid"></div>
  </div>
  <div class="right">
    <div class="log-title">Live Event Log</div>
    <div id="log"><div class="empty">Waiting for a run — execute examples/run_squad.py</div></div>
  </div>
</div>

<script type="text/javascript">
  // Every agent this dashboard knows how to display, and the sequence of
  // steps it goes through. If a new specialist is added later, add its
  // entry here — the dashboard does not guess agent identities from the
  // log alone, so a step from an unknown agent_id is shown under an
  // "Unknown agent" fallback column rather than silently dropped.
  var KNOWN_AGENTS = {
    "orchestrator":      { label: "Orchestrator",     steps: ["plan", "squad_final"] },
    "code-agent":        { label: "Code Agent",       steps: ["read_repo", "run_lint", "fix_applied", "reflect", "decide"] },
    "unit-test-agent":   { label: "Unit Test Agent",  steps: ["read_repo", "run_tests", "reflect", "decide"] },
    "security-agent":    { label: "Security Agent",   steps: ["read_repo", "run_security_scan", "reflect", "decide"] }
  };
  var STEP_LABELS = {
    "plan": "PLAN — routing", "squad_final": "SQUAD FINAL DECISION",
    "read_repo": "tool access — read_repo", "run_lint": "ACT — real lint (pyflakes)",
    "fix_applied": "FIX — auto-corrected issue", "run_tests": "ACT — real tests (pytest)",
    "run_security_scan": "ACT — pattern scan",
    "reflect": "REFLECT — model confidence", "decide": "DECIDE — harness has final say"
  };

  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function buildGrid() {
    var grid = document.getElementById('agentsGrid');
    grid.innerHTML = '';
    for (var agentId in KNOWN_AGENTS) {
      if (!KNOWN_AGENTS.hasOwnProperty(agentId)) continue;
      var info = KNOWN_AGENTS[agentId];
      var col = document.createElement('div');
      col.className = 'agent-col';
      col.setAttribute('data-agent', agentId);
      var head = '<div class="agent-head"><div class="name">' + escapeHtml(info.label) +
        '</div><div class="meta" data-agent-meta="' + agentId + '">version: — · skill: —</div></div>';
      var stepsHtml = '';
      for (var i = 0; i < info.steps.length; i++) {
        var stepKey = info.steps[i];
        stepsHtml += '<div class="step" data-agent="' + agentId + '" data-step="' + stepKey + '">' +
          '<span class="name">' + escapeHtml(STEP_LABELS[stepKey] || stepKey) + '</span>' +
          '<div class="detail"></div></div>';
      }
      col.innerHTML = head + stepsHtml;
      grid.appendChild(col);
    }
  }

  function render(entries) {
    var allSteps = document.querySelectorAll('.step');
    for (var s = 0; s < allSteps.length; s++) {
      allSteps[s].className = 'step';
      var d = allSteps[s].querySelector('.detail');
      if (d) d.textContent = '';
      var b = allSteps[s].querySelector('.badge');
      if (b) b.parentNode.removeChild(b);
    }

    if (!entries || entries.length === 0) return;

    var logDiv = document.getElementById('log');
    logDiv.innerHTML = '';
    for (var i = entries.length - 1; i >= 0; i--) {
      var e = entries[i];
      var div = document.createElement('div');
      div.className = 'log-entry';
      var html = '<span class="ts">' + escapeHtml(e.timestamp) + '</span>' +
        '<span class="agent-tag">' + escapeHtml(e.agent_id || '') + '</span>' +
        '<span class="step-name">' + escapeHtml(e.step || e.node) + '</span> ' +
        '<span class="status-' + escapeHtml(e.status) + '">' + escapeHtml(e.status) + '</span>';
      if (e.detail) html += '<div class="detail">' + escapeHtml(e.detail) + '</div>';
      div.innerHTML = html;
      logDiv.appendChild(div);
    }

    var latest = {};
    var agentMeta = {};
    for (i = 0; i < entries.length; i++) {
      var key = (entries[i].agent_id || '') + ':' + (entries[i].step || entries[i].node);
      latest[key] = entries[i];
      if (entries[i].agent_id) agentMeta[entries[i].agent_id] = entries[i];
    }

    for (var k in latest) {
      if (!latest.hasOwnProperty(k)) continue;
      var entry = latest[k];
      var el = document.querySelector('.step[data-agent="' + entry.agent_id + '"][data-step="' +
        (entry.step || '') + '"]');
      if (!el) continue;
      el.className = 'step ' + entry.status;
      var detailEl = el.querySelector('.detail');
      if (detailEl) detailEl.textContent = entry.detail || '';
      var badge = document.createElement('div');
      badge.className = 'badge ' + entry.status;
      badge.textContent = entry.status;
      el.appendChild(badge);
    }

    for (var aid in agentMeta) {
      if (!agentMeta.hasOwnProperty(aid)) continue;
      var metaEl = document.querySelector('[data-agent-meta="' + aid + '"]');
      if (metaEl) {
        metaEl.textContent = 'version: ' + (agentMeta[aid].agent_version || '—') +
          ' · skill: ' + (agentMeta[aid].skill_id || '—');
      }
    }

    var banner = document.getElementById('finalBanner');
    var finalEntry = latest['orchestrator:squad_final'];
    if (finalEntry) {
      banner.className = 'final-banner ' + finalEntry.status;
      banner.textContent = 'Squad Final Decision: ' + finalEntry.status.toUpperCase() +
        (finalEntry.detail ? '  —  ' + finalEntry.detail : '');
    } else {
      banner.className = 'final-banner';
      banner.textContent = 'Run in progress…';
    }
  }

  function fetchJson(url, onSuccess, onError) {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', url, true);
    xhr.onreadystatechange = function() {
      if (xhr.readyState === 4) {
        if (xhr.status === 200) {
          try { onSuccess(JSON.parse(xhr.responseText)); }
          catch (e) { if (onError) onError(e); }
        } else if (onError) { onError(new Error('status ' + xhr.status)); }
      }
    };
    xhr.send();
  }

  function poll() {
    fetchJson('run_log.json?_=' + new Date().getTime(), render, function() {});
    setTimeout(poll, 1000);
  }

  buildGrid();
  poll();
</script>
</body></html>
