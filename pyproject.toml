[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dewa-observability"
version = "0.1.0"
description = "DEWA agentic harness — data contract, emission SDK, and enforcement layer"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
]

[tool.setuptools.packages.find]
include = ["dewa_observability*"]
